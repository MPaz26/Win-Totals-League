# Applies new files in supabase/migrations to the live database. Run by hand from the Actions tab.
# Repository secret: SUPABASE_DB_URL (Supabase -> Connect -> Session pooler URI, with password)
name: Migrate database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes supabase@2 db push --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
