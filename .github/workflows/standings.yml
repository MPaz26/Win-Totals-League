# Daily standings refresh from ESPN, then League Pass games (scores for the last few days).
# Also runnable by hand from the Actions tab; pick games_mode "season" once per season to
# load the whole schedule. A failed run leaves the last good data in place and GitHub emails you.
#
# Repository variable: SUPABASE_URL (and optionally NBA_SEASON, default 2027)
# Repository secret:   SUPABASE_SERVICE_ROLE_KEY
#
# Note: GitHub disables scheduled workflows in public repos after 60 days without a
# commit. If standings stop updating, re-enable it from the Actions tab.
name: Standings

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC ≈ 6-7am ET, after every game has finished
  workflow_dispatch:
    inputs:
      games_mode:
        description: "Games: recent (last 3 days) or season (load the whole schedule)"
        type: choice
        options: [recent, season]
        default: recent

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run update-standings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NBA_SEASON: ${{ vars.NBA_SEASON || '2027' }}
      - run: npm run update-games
        if: ${{ !cancelled() }} # scores still update if the standings step failed
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NBA_SEASON: ${{ vars.NBA_SEASON || '2027' }}
          MODE: ${{ inputs.games_mode || 'recent' }}
