# Pipelines:
#   push / MR       check web + jobs, run the database tests
#   default branch  also deploy the web app to GitLab Pages; `migrate` is a manual button
#   schedule        only the standings refresh (set one daily, e.g. 0 11 * * * UTC ≈ 6-7am ET)
#
# CI/CD variables (Settings -> CI/CD -> Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY       pages (public values)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY         standings (masked + protected)
#   SUPABASE_DB_URL                                 migrate (masked + protected)
#   NBA_SEASON                                      optional, defaults to 2027 in the job

stages: [check, deploy, cron]

default:
  image: node:24-alpine

.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.default-branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

web:check:
  stage: check
  extends: .not-scheduled
  cache:
    key: { files: [web/package-lock.json] }
    paths: [web/.npm/]
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run typecheck
    - npm run lint

jobs:check:
  stage: check
  extends: .not-scheduled
  script:
    - cd jobs
    - npm ci --no-audit --no-fund
    - npm run typecheck

# Same as `make test-db`: plain Postgres + the Supabase shim, pg_cron migration skipped.
db:test:
  stage: check
  extends: .not-scheduled
  image: postgres:17-alpine
  services:
    - name: postgres:17-alpine
      alias: db
  variables:
    POSTGRES_PASSWORD: test
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: test
  script:
    - until pg_isready -q; do sleep 1; done
    - psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_shim.sql
    - for f in supabase/migrations/*.sql; do case "$f" in *cron*) ;; *) psql -v ON_ERROR_STOP=1 -q -f "$f";; esac; done
    - psql -v ON_ERROR_STOP=1 -f supabase/tests/draft_test.sql

pages:
  stage: deploy
  extends: .default-branch
  script:
    - cd web
    - npm ci --no-audit --no-fund
    # Project sites are served from /<project>/ unless "unique domain" is on; CI_PAGES_URL tells us which.
    - export BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##')/"
    - npm run build
    # Pages has no SPA rewrite; serving the app as the 404 page makes deep links (/join/abc) work.
    - cp dist/index.html dist/404.html
    - mv dist ../public
  artifacts:
    paths: [public]

migrate:
  stage: deploy
  extends: .default-branch
  when: manual
  script:
    - npx --yes supabase@2 db push --db-url "$SUPABASE_DB_URL"

standings:
  stage: cron
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cd jobs
    - npm ci --omit=dev --no-audit --no-fund
    - npm run update-standings
