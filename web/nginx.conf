server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (invite links like /join/abc) fall back to the SPA,
    # same as the 404.html copy does on GitLab Pages.
    location / {
        try_files $uri /index.html;
    }
}
