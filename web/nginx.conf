server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Not content-hashed, so a week rather than immutable; sw.js caches them past that.
    location /logos/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Client-side routes (invite links like /join/abc) fall back to the SPA,
    # same as the 404.html copy does on GitHub Pages.
    location / {
        try_files $uri /index.html;
    }
}
